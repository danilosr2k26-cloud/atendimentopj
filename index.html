<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Bradesco Net Empresa · Central de Mensagens</title>
<link rel="shortcut icon" href="https://banco.bradesco/assets/pessoajuridica/img/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="css/theme.css">
<style>
  /* ============ MOBILE FIRST ============ */
  :root{
    --bg:#e3edf7; --card:#ffffff; --card2:#f6f7f8; --linha:#dcdee1;
    --texto:#808387; --suave:#245189; --prim:#c6082f;
    --ok:#0a7d3b; --raio:14px; --b-red:#c6082f;
  }
  #painel{background: #fff;}
  @media (prefers-color-scheme: light){
    :root{ --bg:#e3edf7; --card:#d1d2d5; --card2:#ebecf1; --linha:#070707;
           --texto:#070707; --suave:#1a68b5; --prim:#e04a63;
           --ok:#3ddc84; --b-red:#ff5f78; }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--bg); color:var(--texto);
        font-family:-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
        display:flex; flex-direction:column; align-items:center; min-height:100vh; }
  .app{ width:100%; max-width:480px; padding:14px 14px 90px; }

  header{ display:flex; align-items:center; gap:12px; padding:8px 2px 14px; }
  .linha-marca{ margin:0; }
  header h1.pagina{ font-size:14px; margin:0; line-height:1.2; color:var(--suave); font-weight:600; }
  header small{ color:var(--suave); font-weight:400; display:block; font-size:12px; }

  .card{ background:var(--card); border:1px solid var(--linha);
         border-radius:var(--raio); padding:14px; margin-bottom:14px; }
  .card h2{ font-size:13px; text-transform:uppercase; letter-spacing:.06em;
            color:var(--suave); margin:0 0 10px; }

  /* Campos de nome */
  .campos{ display:grid; gap:10px; }
  .campo label{ display:block; font-size:12px; color:var(--suave);
                margin:0 2px 5px; font-weight:600; }
  .campo input{ width:100%; font-size:18px; padding:14px; border-radius:12px;
                border:1px solid var(--linha); background:var(--card2);
                color:var(--texto); outline:none; }
  .campo input:focus{ border-color:var(--prim); }

  /* Lista de títulos */
  .titulos{ display:grid; gap:8px; }
  .grupo{ font-size:11px; text-transform:uppercase; letter-spacing:.08em;
          color:var(--suave); font-weight:700; margin:12px 2px 4px; }
  .grupo:first-child{ margin-top:0; }
  .titulo{ display:flex; align-items:center; gap:10px; width:100%; text-align:left;
           font-size:15px; padding:13px 14px; border-radius:12px; cursor:pointer;
           border:1px solid var(--linha); background:var(--card2); color:var(--texto); }
  .titulo .num{ width:26px; height:26px; border-radius:8px; flex:none;
                background:var(--card); border:1px solid var(--linha);
                display:grid; place-items:center; font-size:12px; color:var(--suave); }
  .titulo.ativa{ border-color:var(--prim); background:color-mix(in srgb,var(--prim) 15%, var(--card2)); }
  .titulo.ativa .num{ background:var(--prim); color:#0b1220; border-color:var(--prim); font-weight:700; }

  /* Painel da mensagem */
  textarea{ width:100%; min-height:170px; resize:vertical; font-size:16px; line-height:1.5;
            padding:14px; border-radius:12px; border:1px solid var(--linha);
            background:var(--card2); color:var(--texto); outline:none; font-family:inherit; }
  textarea:focus{ border-color:var(--prim); }

  .acoes{ display:flex; gap:10px; margin-top:10px; }
  .btn{ flex:1; font-size:16px; font-weight:700; padding:15px; border-radius:12px;
        border:none; cursor:pointer; transition:transform .06s, opacity .2s; }
  .btn:active{ transform:scale(.97); }
  .btn-copiar{ background:var(--prim); color:#fff; }
  .btn-copiar.copiado{ background:var(--ok); color:#fff; }
  .btn-rest{ flex:0 0 auto; padding:15px 14px; background:transparent;
             border:1px solid var(--linha); color:var(--suave); font-weight:600; }

  .rodape{ text-align:center; color:var(--suave); font-size:12px; margin-top:4px; }

  /* ============ DESDE TABLET CIMA ============ */
  @media (min-width:640px){
    .app{ padding-top:28px; }
    .campos{ grid-template-columns:1fr 1fr; }
    textarea{ min-height:220px; }
    .cc-nav{ height:60px;}
  }
  /* ============ DESDE DESKTOP CIMA: painel FIXO, lista com scroll interno ============ */
  @media (min-width:1024px){
    html{ height:100%; overflow:hidden; }
    body{ height:100%; min-height:0; padding:0; overflow:hidden; }
    .app{ max-width:1000px; flex:1 1 auto; min-height:0; display:flex; flex-direction:column;
          overflow:hidden; padding-top:0; padding-bottom:12px; }
    header{ flex:none; }
    .app-content{ flex:1 1 auto; min-height:0;
                  display:grid; grid-template-columns:400px 1fr;
                  grid-template-rows:auto 1fr; gap:14px; align-items:stretch; }
    .app-content .card{ margin-bottom:0; margin-top:0; }
    #card-campos { grid-column:1; grid-row:1; flex:none; }
    #card-painel { grid-column:2; grid-row:1 / span 2; min-height:0;
                   display:flex; flex-direction:column; }
    #card-painel textarea{ flex:1 1 auto; min-height:0; resize:none; }
    #card-titulos{ grid-column:1; grid-row:2; min-height:0;
                  display:flex; flex-direction:column; }
    #card-titulos .titulos{ flex:1 1 auto; min-height:0; overflow-y:auto; padding-right:2px; }
    .rodape{ flex:none; margin-top:10px; }
  }
  /* ════════ IDENTIDADE BRADESCO NET EMPRESA ════════
     Troque o SVG .brinco por um <img> do logotipo oficial quando tiver
     o arquivo (mantendo a classe .brinco). */
  .marca{ display:inline-flex; align-items:center; gap:9px; }
  .brinco{ width:30px; height:30px; color:var(--b-red,#c6082f); flex:none; display:block; }
  .b-word{ font-size:20px; font-weight:800; letter-spacing:-.02em; color:var(--b-red,#c6082f); }
  .b-sep{ width:1.5px; height:20px; background:var(--border,var(--line,#dcdfe2)); }
  .b-net{ font-size:15px; font-weight:600; color:var(--text,var(--ink,#1a1b1d)); opacity:.9; white-space:nowrap; }
  .b-pag{ font-size:14px; font-weight:500; color:var(--muted,#5f6368); white-space:nowrap; margin-left:2px; }
  /* ════════ MENU ENTRE TELAS ════════
     Mesmo bloco em todas as telas; em cada uma, class="ativa" na própria. */
  .cc-nav{ position:sticky; top:0; z-index:60; width:100%; height:auto; flex:0 0 auto; display:flex; gap:10px;
          padding:9px 12px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
          background:var(--surface,var(--card,#fff));
          border-bottom:1px solid var(--border,var(--line,#e2e4e7)); }
  .cc-nav::-webkit-scrollbar{ display:none; }
  .cc-nav a{ flex:none; font-size:13px; font-weight:600; color:var(--muted,#5f6368);
             text-decoration:none; padding:8px 14px; border-radius:999px;
             border:1px solid transparent; white-space:nowrap; }
  .cc-nav a:hover{ color:var(--text,var(--ink,#1a1b1d)); }
  .cc-nav a.ativa{ background:#c6082f; border-color:#c6082f; color:#fff; }
</style>
</head>
<body>

<!-- ══════════ MENU ENTRE TELAS ══════════
     Nas outras telas, cole este <nav> inteiro logo após o <body> e mova a
     classe "ativa" para a opção da própria tela.
     (Se o arquivo se chamar "tarifas.html", ajuste o link abaixo.) -->
<nav class="cc-nav">
  <a href="index.html" class="ativa">Mensagens</a>
  <a href="tarifas.html">Tarifas</a>
  <a href="cadastro.html">Cadastro</a>
  <a href="cadastro_novo.html">Cadastro novo</a>
  <a href="#" class="sair" id="btnSair">Sair</a>
</nav>

<div class="app">

  <header>
    <div class="linha-marca"><span class="marca"><img class="brinco" src="img/net.png" alt="" srcset=""><span class="b-word">bradesco</span><span class="b-sep"></span><span class="b-net">Net&nbsp;Empresa</span></span></div>
    <h1 class="pagina">Central de Mensagens <small id="hora-atual"></small></h1>
    <button class="theme-btn" id="themeBtn" type="button">Tema</button>
  </header>

  <div class="app-content">

    <!-- Nomes -->
    <section class="card" id="card-campos">
      <h2>Dados do atendimento</h2>
      <div class="campos">
        <div class="campo">
          <label for="nome-cliente">Cliente → {NOME_CLIENTE}</label>
          <input id="nome-cliente" type="text" autocomplete="off"
                 placeholder="Ex.: Camila">
        </div>
        <div class="campo">
          <label for="nome-gerente">Gerente → {NOME_GERENTE}</label>
          <input id="nome-gerente" type="text" autocomplete="off"
                 placeholder="Ex.: André Raponi">
        </div>
        <div class="campo">
          <label for="empresa">Empresa → {EMPRESA}</label>
          <input id="empresa" type="text" autocomplete="off"
                 placeholder="Ex.: Construtora Silva Ltda">
        </div>
        <div class="campo">
          <label for="conta">Conta → {CONTA}</label>
          <input id="conta" type="text" autocomplete="off"
                 placeholder="Ex.: 1234-5">
        </div>
      </div>
    </section>

    <!-- Painel editável (ANTES da lista no mobile) -->
    <section class="card" id="card-painel">
      <h2>Painel <span style="font-weight:400;text-transform:none">(pode editar)</span></h2>
      <textarea id="painel" spellcheck="false" placeholder="Selecione uma mensagem abaixo…"></textarea>
      <div class="acoes">
        <button class="btn btn-rest" id="btn-restaurar" title="Volta a mensagem original">↺</button>
        <button class="btn btn-copiar" id="btn-copiar">📋 Copiar</button>
      </div>
    </section>

    <!-- Títulos das mensagens -->
    <section class="card" id="card-titulos">
      <h2>Mensagens</h2>
      <div id="lista-titulos" class="titulos"></div>
    </section>

  </div>

  <p class="rodape" id="rodape"></p>
</div>

<script src="js/common.js"></script>
<script>
BN.garanteLogin(); BN.initTema(); BN.logoutNoNav();
/* ════════════════════════════════════════════════════════════════════
   COMO INCLUIR NOVAS MENSAGENS
   ────────────────────────────────────────────────────────────────────
   1. No array MENSAGENS abaixo, copie um bloco
      { titulo: …, mensagem: … } e cole perto das mensagens do mesmo
      assunto (elas estão organizadas em grupos).

   2. O "titulo" é o que aparece no menu. O "mensagem" é o texto que
      sai no painel, com as chaves já trocadas.

   3. Opcional: use a propriedade "grupo: "Nome do grupo"" para criar
      uma separação com rótulo na lista. Não repita o grupo na primeira
      mensagem de cada bloco — um "grupo" por bloco já separa tudo.

   EXEMPLO:
   {
     grupo: "Crédito",
     titulo: "Proposta de empréstimo",
     mensagem: "{SAUDACAO}, {NOME_CLIENTE}. Consegue ficar com o computador? Quero verificar uma proposta para você."
   }

   CHAVES DISPONÍVEIS (preenchidas sozinhas, sem digitar nada):
     {SAUDACAO}      → "Bom dia" (5h–12h) · "Boa tarde" (12h–18h) · "Boa noite" (18h–5h)
     {DIA}           → "Segunda-feira", "Terça-feira", … conforme a data
     {NOME_CLIENTE}  → campo "Cliente"; se estiver vazio, vira "cliente"
     {NOME_GERENTE}  → campo "Gerente" (nome do gerente anterior nos grupos
                       de rotatividade); se estiver vazio, a chave fica
                       visível no texto para lembrar de preencher
     {EMPRESA}       → campo "Empresa"; vazio → chave visível no texto
     {CONTA}         → campo "Conta"; vazio → chave visível no texto
     {NOME}          → aceita como sinônimo de {NOME_CLIENTE} (mensagens antigas)

   QUERER MAIS CHAVES? Ex.: {CIDADE}:
     • na mensagem, escreva onde a chave deve vir: "…em {CIDADE}…"
     • no objeto CAMPOS_EXTRA abaixo, adicione: CIDADE: "São Paulo"
       e pronto — a função aplicarChaves() troca automaticamente.

   ORDEM DA LISTA: os grupos seguem a ordem dos blocos em MENSAGENS,
   então para mover/reordenar, mova os blocos inteiros.
   ════════════════════════════════════════════════════════════════════ */

// Chaves extras manuais (opcionais). Deixe vazio se não for usar.
const CAMPOS_EXTRA = {
  // CIDADE: "São Paulo"
};

/* ── Auto-chaves ── */
const NOMES_DIA = ["Domingo","Segunda-feira","Terça-feira","Quarta-feira",
                   "Quinta-feira","Sexta-feira","Sábado"];

function getSaudacao(){
  const h = new Date().getHours();
  if (h >= 5  && h < 12) return "Bom dia";
  if (h >= 12 && h < 18) return "Boa tarde";
  return "Boa noite";
}
function getDia(){ return NOMES_DIA[new Date().getDay()]; }
function getNomeCliente(){
  const n = document.getElementById("nome-cliente").value.trim();
  return n || "cliente";                                  // vazio → "cliente"
}
function getNomeGerente(){
  const n = document.getElementById("nome-gerente").value.trim();
  // vazio → devolve a própria chave, para ficar visível no texto e lembrar de preencher
  return n || "{NOME_GERENTE}";
}
// Mesma regra para empresa e conta: vazio → chave fica visível no texto
const getEmpresa = () => document.getElementById("empresa").value.trim() || "{EMPRESA}";
const getConta   = () => document.getElementById("conta").value.trim()   || "{CONTA}";

function aplicarChaves(texto){
  const mapa = {
    SAUDACAO: getSaudacao(),
    DIA: getDia(),
    NOME_CLIENTE: getNomeCliente(),
    NOME_GERENTE: getNomeGerente(),
    EMPRESA: getEmpresa(),
    CONTA: getConta(),
    NOME: getNomeCliente(),   // compatibilidade com mensagens antigas
    ...CAMPOS_EXTRA
  };
  return texto.replace(/\{(\w+)\}/g, (bruta, chave) => chave in mapa ? mapa[chave] : bruta);
}

/* ── Estado da UI ── */
let indiceAtivo = -1;

const lista   = document.getElementById("lista-titulos");
const painel  = document.getElementById("painel");
const btnCop  = document.getElementById("btn-copiar");
const btnRest = document.getElementById("btn-restaurar");

// Monta o menu de títulos com rótulos de grupo
let grupoAtual = null;
MENSAGENS.forEach((m, i) => {
  if (m.grupo && m.grupo !== grupoAtual){
    const g = document.createElement("div");
    g.className = "grupo";
    g.textContent = m.grupo;
    lista.appendChild(g);
    grupoAtual = m.grupo;
  }
  const b = document.createElement("button");
  b.className = "titulo";
  b.innerHTML = `<span class="num">${i+1}</span><span>${m.titulo}</span>`;
  b.addEventListener("click", () => selecionar(i));
  lista.appendChild(b);
});

function selecionar(i){
  indiceAtivo = i;
  [...lista.querySelectorAll(".titulo")].forEach((el, j) => el.classList.toggle("ativa", j === i));
  painel.value = aplicarChaves(MENSAGENS[i].mensagem);
  atualizarRodape();
}

// Mudou qualquer nome → atualiza a mensagem na hora
["nome-cliente","nome-gerente","empresa","conta"].forEach(id => {
  document.getElementById(id).addEventListener("input", () => {
    if (indiceAtivo >= 0) painel.value = aplicarChaves(MENSAGENS[indiceAtivo].mensagem);
    else painel.value = aplicarChaves(painel.value);
    atualizarRodape();
  });
});

// Teclas 1–9 escolhem a mensagem sem tirar a mão do teclado
document.addEventListener("keydown", e => {
  const tag = document.activeElement.tagName;
  if (/^[1-9]$/.test(e.key) && tag !== "TEXTAREA" && tag !== "INPUT") {
    const i = +e.key - 1;
    if (i < MENSAGENS.length) selecionar(i);
  }
});

// Restaurar original (caso o atendente tenha editado o painel)
btnRest.addEventListener("click", () => {
  if (indiceAtivo >= 0) painel.value = aplicarChaves(MENSAGENS[indiceAtivo].mensagem);
});

// Copiar com fallback para navegadores antigos / HTTP
async function copiar(){
  const texto = painel.value.trim();
  if (!texto) return;
  try { await navigator.clipboard.writeText(texto); }
  catch {
    painel.focus(); painel.select();
    document.execCommand("copy");
  }
  const old = btnCop.innerHTML;
  btnCop.innerHTML = "✓ Copiado!";
  btnCop.classList.add("copiado");
  setTimeout(() => { btnCop.innerHTML = old; btnCop.classList.remove("copiado"); }, 1500);
}
btnCop.addEventListener("click", copiar);

// Relógio + rodapé
function atualizarHoras(){
  document.getElementById("hora-atual").textContent =
    new Date().toLocaleDateString("pt-BR",{weekday:"long", day:"2-digit", month:"long"}) +
    " · " + new Date().toLocaleTimeString("pt-BR",{hour:"2-digit", minute:"2-digit"});
}
function atualizarRodape(){
  const emp = document.getElementById("empresa").value.trim();
  const cta = document.getElementById("conta").value.trim();
  let extra = "";
  if (emp) extra += ` · Empresa: ${emp}`;
  if (cta) extra += ` · Conta: ${cta}`;
  document.getElementById("rodape").textContent =
    `Saudação: ${getSaudacao()} · Dia: ${getDia()} · Cliente: ${getNomeCliente()}${extra}`;
}
setInterval(atualizarHoras, 1000 * 30);
atualizarHoras();
atualizarRodape();
selecionar(0); // abre já com a primeira mensagem
